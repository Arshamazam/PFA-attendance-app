version: '3.8'
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: attendance_postgres
    environment:
      POSTGRES_USER: attendance_dev
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: attendance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
